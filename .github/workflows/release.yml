# A release: push a tag v<version> (git tag v0.1.0 && git push origin v0.1.0).
#
# Tests, then builds flux for Windows, macOS and Linux (x64 and arm64),
# attaches the binaries to a GitHub release, and publishes @upskale/flux,
# its six platform packages and @upskale/create-flux to npm with provenance.
#
# Needs the repo secret NPM_TOKEN: an npm automation token that can publish
# to the @upskale scope.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: go test ./...
      - name: Build and publish to npm
        run: node scripts/release.mjs "${GITHUB_REF_NAME#v}" --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/bin/* --title "Flux ${GITHUB_REF_NAME#v}" --generate-notes
